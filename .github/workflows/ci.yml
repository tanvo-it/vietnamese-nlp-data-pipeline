name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, "3.10"]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov nbformat nbconvert
    
    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Test notebook syntax
      run: |
        # Check if notebooks can be converted (syntax check)
        jupyter nbconvert --to script Encoder_Only.ipynb --stdout > /dev/null
        jupyter nbconvert --to script Decoder_Only.ipynb --stdout > /dev/null
        jupyter nbconvert --to script Encoder_Decoder.ipynb --stdout > /dev/null
    
    - name: Test imports
      run: |
        python -c "
        import torch
        import transformers
        import datasets
        print('✅ All core dependencies imported successfully')
        print(f'PyTorch: {torch.__version__}')
        print(f'Transformers: {transformers.__version__}')
        "

  notebook-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.9
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install nbformat nbconvert jupyter
    
    - name: Execute notebooks (dry run)
      run: |
        # Create a test script that imports key functions without full execution
        echo "
        import sys
        sys.path.append('.')
        
        # Test key imports from notebooks
        import torch
        import transformers
        from datasets import load_dataset
        
        print('✅ Notebook dependencies check passed')
        " > test_notebook_deps.py
        
        python test_notebook_deps.py

  documentation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Check documentation
      run: |
        # Check if all required documentation files exist
        files=("README.md" "ARCHITECTURE_GUIDE.md" "SETUP_GUIDE.md" "CONTRIBUTING.md" "LICENSE")
        for file in "${files[@]}"; do
          if [ ! -f "$file" ]; then
            echo "❌ Missing required file: $file"
            exit 1
          else
            echo "✅ Found: $file"
          fi
        done
    
    - name: Check README links
      run: |
        # Basic check for broken internal links in README
        if grep -q "](LICENSE)" README.md && [ ! -f "LICENSE" ]; then
          echo "❌ Broken link to LICENSE in README"
          exit 1
        fi
        echo "✅ README links check passed"

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Run security checks
      run: |
        pip install safety bandit
        # Check for known security vulnerabilities
        safety check --file requirements.txt || true
        # Run bandit security linter
        bandit -r . -f json || true